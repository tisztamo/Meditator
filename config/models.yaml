# Model registry — maps roles and presets to provider + model pairs.
# See doc/configuration.md for usage.

defaultProfile: cloud

providers:
  local:
    baseURL: "${LOCAL_LLM_BASE_URL:http://localhost:1248}"
    apiKey: "${LOCAL_LLM_API_KEY:none}"
    thinking: "${LOCAL_LLM_THINKING:0}"
  openrouter:
    baseURL: "https://openrouter.ai/api/v1"
    apiKey: "${OPENROUTER_API_KEY}"
  # A System-One provider: it answers questions (noul/choice/score) and generates
  # no text, so it speaks a different wire protocol from the chat providers above.
  # `kind: decision` is what routes it to decide() instead of complete(); every
  # provider without a kind is implicitly `kind: completion`.
  # See doc/plans/jev-system-one-integration.md. State leaves the box: binding a
  # role to this provider is a profile decision with a privacy note, never a default.
  typesafe:
    kind: decision
    baseURL: "https://api.typesafe.ai/v1"
    apiKey: "${TYPESAFE_API_KEY}"

roles:
  voice:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  utility:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  # The tier-2 comparator (m-judge). Separate from utility because it grades the
  # mind's own evidence: see doc/research/expect-study.md §2.6, where the local
  # model scored the same as this one on the B1 ledger.
  judge:
    provider: openrouter
    model: deepseek/deepseek-v4-flash

presets:
  gpu-local:
    provider: local
    model: ardincoder-1
  gpu-qwen:
    provider: local
    model: qwen3.6-35b-a3b
  jev:
    provider: typesafe
    model: jev-latest

profiles:
  cloud:
    roles:
      voice: voice
      utility: utility
      judge: judge
  local-dev:
    roles:
      voice: gpu-local
      utility: gpu-local
      judge: gpu-local
  # Conscious stream on the local model (ardincoder-1), background/utility work
  # (memory distillation, scribe, loop-detector, interrupt scoring) on the cheap
  # cloud model. Tests whether the deepseek drift/identity-collapse seen in the
  # cloud profile (lemma-lab-18) is confined to the utility role when the VOICE
  # is held by the local model.
  local-voice:
    roles:
      voice: gpu-local
      utility: utility
      # The judge goes local even though utility does not: the local model matched
      # the cloud one pair-for-pair on the B2 gate (0.900 blind agreement each),
      # and the mind's evidence never leaves the box to be graded.
      judge: gpu-local
  # local-voice with the comparator on a System-One model instead of an LLM.
  # Voice stays on the local box; utility stays on the cheap cloud model; the
  # judge becomes TypeSafe's Jev (a `decision` provider), which m-judge reaches
  # through decide() rather than complete() — a `kind` switch, not a new port.
  #
  # PRIVACY — the reason this is a profile and never a default: the judge's state
  # is the mind's own expectation and the perception it is graded against, and
  # under this profile that text LEAVES THE BOX, to a third-party endpoint. Under
  # `local-voice` the judge was deliberately kept local so the mind's evidence is
  # never graded off-box; choosing this profile knowingly gives that up in
  # exchange for a calibrated, ~300 ms verdict. See doc/architecture/components.md
  # (m-judge) and doc/research/expect-study.md §2.7–2.8.
  local-voice-jev:
    roles:
      voice: gpu-local
      utility: utility
      judge: jev
